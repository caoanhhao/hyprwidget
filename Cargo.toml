[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/caoanhhao/hyprwidget"

[workspace.dependencies]
hw-core = { path = "crates/hw-core" }
hw-ui = { path = "crates/hw-ui" }
hw-services = { path = "crates/hw-services" }
hw-lua = { path = "crates/hw-lua" }
hw-embed = { path = "crates/hw-embed" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
gtk4 = { version = "0.11", features = ["v4_18"] }
glib = "0.22"
gio = "0.22"
async-channel = "2"
grass = { version = "0.13", default-features = false }
gtk4-layer-shell = "0.8"
mlua = { version = "0.12", features = ["lua55", "async", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gdk-pixbuf = "0.22"
vte4 = { version = "0.10", features = ["v0_80"] }

[workspace.lints.rust]
# BeautifulRust lints (https://github.com/morganlinton/BeautifulRust, lints/lints.toml).
# This is an application, so the [lib]-only lints are left out: missing_docs,
# missing_panics_doc, missing_errors_doc, exhaustive_enums, print_stdout/stderr.
# CI: cargo clippy --workspace --all-targets --all-features -- -D warnings
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[package]
name = "hyprwidget"
description = "Wayland layer-shell widget framework: GTK4 + Lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hw-core.workspace = true
hw-ui.workspace = true
hw-lua.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
