[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/caoanhhao/hyprwidget"

[workspace.dependencies]
hw-core = { path = "crates/hw-core" }
hw-ui = { path = "crates/hw-ui" }
hw-services = { path = "crates/hw-services" }
hw-lua = { path = "crates/hw-lua" }
hw-embed = { path = "crates/hw-embed" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
gtk4 = { version = "0.11", features = ["v4_18"] }
glib = "0.22"
gio = "0.22"
async-channel = "2"
grass = { version = "0.13", default-features = false }
gtk4-layer-shell = "0.8"
mlua = { version = "0.12", features = ["lua55", "async", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "hyprwidget"
description = "Wayland layer-shell widget framework: GTK4 + Lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hw-core.workspace = true
hw-ui.workspace = true
hw-lua.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
